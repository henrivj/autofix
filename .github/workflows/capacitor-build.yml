# Save as .github/workflows/capacitor-build.yml
name: Capacitor Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build   # outputs to your webDir (dist/ or www/)

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: dist          # change to your webDir
          retention-days: 1

  android:
    name: Build Android
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: dist          # change to your webDir

      - name: Sync Capacitor
        run: npx cap sync android

      # Debug APK (no signing needed)
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Signed release AAB (only on main; needs secrets, see notes below)
      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Build signed release AAB
        if: github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  ios:
    name: Build iOS
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: dist          # change to your webDir

      - name: Sync Capacitor
        run: npx cap sync ios

      # Unsigned simulator build to verify the project compiles.
      # For App Store / TestFlight, add signing (e.g. fastlane match) and archive instead.
      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

# ---------------------------------------------------------------
# Secrets needed for the signed Android release (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 -w0 release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# ---------------------------------------------------------------
